<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 75" fill="none">
  <!-- Architectural Triangle Roof: Exactly placed as roof above S -->
  <polygon points="36.5,7 66,36.5 7,36.5" fill="#B3B3B3" />
  
  <!-- Bold Teal Monogram S: Only top curve enters into the bottom of triangle -->
  <text
    x="36.5"
    y="65"
    font-family="'Plus Jakarta Sans', Arial, Helvetica, sans-serif"
    font-size="52"
    font-weight="900"
    fill="#80B3AD"
    text-anchor="middle"
  >S</text>

  <!-- Typography: SAYBA (Bold Luxury Geometric) -->
  <text
    x="71"
    y="35"
    font-family="'Plus Jakarta Sans', Arial, Helvetica, sans-serif"
    font-size="27"
    font-weight="800"
    letter-spacing="0.22em"
    fill="#141515"
  >SAYBA</text>

  <!-- Typography: GROUP (Refined Geometric) -->
  <text
    x="71"
    y="58"
    font-family="'Plus Jakarta Sans', Arial, Helvetica, sans-serif"
    font-size="19"
    font-weight="700"
    letter-spacing="0.42em"
    fill="#211F1F"
  >GROUP</text>
</svg>